name: PR title

# PRs are squash-merged, so the PR title becomes the commit message that release-please
# reads. Fail early when it isn't a Conventional Commit.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|ci|refactor|test|perf|build|style|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "✔ $TITLE"
            exit 0
          fi
          echo "::error::PR title \"$TITLE\" isn't a Conventional Commit."
          echo "Start it with a type, e.g. \"fix: correct Slider parameters\" or \"feat: add Badge examples\"."
          echo "fix: releases a patch, feat: a minor version, feat!: a major version; docs:, chore:, ci: don't release."
          exit 1
