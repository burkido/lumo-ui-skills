name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create zip archive
        run: git archive --format=zip --output=lumo-ui-skill.zip HEAD

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag_name }}" \
            lumo-ui-skill.zip \
            --title "${{ github.event.inputs.tag_name }}" \
            --notes "Release of lumo-ui-skill ${{ github.event.inputs.tag_name }}"
